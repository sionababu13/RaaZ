<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Create Account — RAAZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <div class="grain-overlay"></div>

  <main class="section narrow fade-in">
    <h1>Create an Account</h1>
    <p>Reserved. Personal. Uncluttered.</p>

    <form class="auth-form">
      <input id="name" name="name" type="text" placeholder="Full Name" required autocomplete="name">

      <input id="email" name="email" type="email" placeholder="Email" required autocomplete="email">

      <input id="password" name="password" type="password" placeholder="Password" required minlength="6"
        autocomplete="new-password">

      <button class="button-primary" type="submit">
        Sign Up
      </button>
    </form>
  </main>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
</body>

</html>
