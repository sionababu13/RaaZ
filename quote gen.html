<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RAAZ Quote Generator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: #000;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    /* QUOTE BOX */
    #quote-box {
      position: absolute;
      top: 5px;
      left: 250px;

      background: #d4af37;
      color: black;

      padding: 14px 20px;
      border: 2px solid white;
      border-radius: 18px;

      font-style: italic;
      max-width: 240px;

      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* CURVED TAIL */
    #quote-box::after {
      content: "";
      position: absolute;

      width: 18px;
      height: 18px;

      background: #d4af37;

      left: -8px;
      top: 15px;

      border-left: 2px solid white;
      border-bottom: 2px solid white;

      border-bottom-left-radius: 50%;
      transform: rotate(45deg);
    }

    /* FADE EFFECT */
    #quote-text {
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">RAAZ</div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Menu</a>
      <a href="#">Sign In</a>
      <a href="#">Sign Up</a>
    </div>

    <!-- QUOTE BOX -->
    <div id="quote-box">
      <p id="quote-text">Welcome to RAAZ</p>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const quotes = [
      "Where silence meets flavor.",
      "RAAZ is not just food, it's an experience.",
      "Indulgence, redefined.",
      "Crafted slowly. Served thoughtfully.",
      "Every bite tells a story."
    ];

    let index = 0;

    function changeQuote() {
      const quoteEl = document.getElementById("quote-text");

      quoteEl.style.opacity = 0;

      setTimeout(() => {
        index = (index + 1) % quotes.length;
        quoteEl.textContent = quotes[index];
        quoteEl.style.opacity = 1;
      }, 300);
    }

    setInterval(changeQuote, 3000);
  </script>

</body>
</html>
