<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign In — RAAZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <div class="grain-overlay"></div>

  <main class="section narrow fade-in">
    <h1>Welcome Back</h1>
    <p>Access your orders and preferences.</p>

    <form class="auth-form">
      <input id="email" name="email" type="email" placeholder="Email" required autocomplete="email">

      <input id="password" name="password" type="password" placeholder="Password" required minlength="6"
        autocomplete="current-password">

      <button class="button-primary" type="submit">
        Sign In
      </button>
    </form>
  </main>

  <!-- ✅ ADD THESE SCRIPTS -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>

</body>

</html>
